# Codex profile template for opencode-go.
# Copy to $CODEX_HOME/opencode-go.config.toml and set OPENCODE_GO_API_KEY in the environment.

model = "opencode-go/deepseek-v4-flash"
model_provider = "opencode_go"

[model_providers.opencode_go]
name = "opencode_go"
base_url = "https://opencode.ai/zen/go/v1"
env_key = "OPENCODE_GO_API_KEY"
wire_api = "chat"
